name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/app ./internal/table ./internal/web
      - name: Build portable packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --version "${RELEASE_TAG#v}"
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt dist/release-manifest.json --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
